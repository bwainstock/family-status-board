; Firmware for the Board — see issue #2 for the shape of the whole thing.
;
; Two environments, on purpose:
;
;   board   the real thing, on the CrowPanel ESP32 5.79" (ESP32-S3-WROOM-1-N8R8)
;   native  the host, for the parts that must not need hardware to verify
;
; Everything under lib/frame/ compiles in both. Nothing in there may include
; Arduino.h, because the whole point is that the Frame's byte layout is
; verifiable without a panel in the room.
;
;   pio test -e native      run the host tests
;   pio run -e board        build the firmware
;   pio run -e board -t upload -t monitor

[platformio]
default_envs = board

[env:board]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=0
	-std=gnu++17
build_unflags = -std=gnu++11
board_build.flash_size = 8MB
board_build.partitions = huge_app.csv

; Upstream GxEPD2, not the driver bundled with the vendor's examples: that one
; predates this panel and talks to the two SSD1683 controllers by hand.
lib_deps =
	zinggjm/GxEPD2@^1.6.9

; The Bluetooth serial port is also a /dev/cu.* device and PlatformIO will
; happily pick it. The CrowPanel's USB-UART bridge is the usbserial one.
upload_port = /dev/cu.usbserial*
monitor_port = /dev/cu.usbserial*
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

[env:native]
platform = native
test_framework = unity
build_flags =
	-std=c++17
	-Wall
	-Wextra
